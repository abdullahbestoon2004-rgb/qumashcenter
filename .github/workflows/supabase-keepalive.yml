name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows running manually anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ssabpqwddoifaxdxkwzn.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzYWJwcXdkZG9pZmF4ZHhrd3puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDA2NzYsImV4cCI6MjA5ODExNjY3Nn0.Q1tSy2KXSKxDQsj_D8pe_ewh6Lrqr0dLJNe-dk3dlkQ' }}
        run: |
          echo "Pinging Supabase database at $SUPABASE_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$SUPABASE_URL/rest/v1/orders?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase! Database is active and inactivity timer has been reset."
          else
            echo "Warning: Received HTTP $HTTP_STATUS ($BODY)"
            exit 1
          fi
